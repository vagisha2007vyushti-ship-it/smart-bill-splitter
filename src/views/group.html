<div class="card">
  <h2>Add Group Expense</h2>
  <p class="subtitle">Record items, shops, payers, and select exact beneficiaries.</p>
  
  <div class="form-grid">
    <div class="form-group">
      <label for="expense-desc">Description</label>
      <input type="text" id="expense-desc" placeholder="e.g., Pizza, Movie tickets">
    </div>

    <div class="form-group">
      <label for="expense-place">Place / Shop</label>
      <input type="text" id="expense-place" placeholder="e.g., Pizza Hut">
    </div>
    
    <div class="form-group">
      <label for="expense-amount">Amount (₹)</label>
      <input type="number" id="expense-amount" placeholder="0.00" step="0.01">
    </div>
    
    <div class="form-group">
      <label for="expense-payer">Paid By</label>
      <select id="expense-payer">
        <!-- Populated by JavaScript -->
      </select>
    </div>

    <div class="form-group full-width">
      <label>Paid For (Select people sharing this expense)</label>
      <div id="expense-shared-container">
        <!-- Populated by JavaScript checkboxes -->
      </div>
    </div>
  </div>
  
  <button id="add-expense-btn" class="mt-sm">Add Expense</button>

  <h3 class="mt-xl">Expense History</h3>
  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>Description / Place</th>
          <th>Amount</th>
          <th>Paid By</th>
          <th>Paid For</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="expense-table-body">
        <!-- Populated by JavaScript -->
      </tbody>
    </table>
  </div>
</div>
