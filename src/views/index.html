<div class="card">
  <h2>Quick Split Calculator</h2>
  <p class="subtitle">Instantly split a bill among friends with custom tax and tip calculated in ₹.</p>
  
  <div class="form-grid">
    <div class="form-group full-width">
      <label for="quick-bill">Total Bill Amount (₹)</label>
      <input type="number" id="quick-bill" placeholder="0.00" step="0.01">
    </div>
    
    <div class="form-group">
      <label for="quick-people">Number of People</label>
      <input type="number" id="quick-people" placeholder="1" min="1">
    </div>
    
    <div class="form-group">
      <label for="quick-tax">Tax Percentage (%)</label>
      <input type="number" id="quick-tax" placeholder="0" step="0.1">
    </div>
    
    <div class="form-group full-width">
      <label for="quick-tip">Tip Percentage (%)</label>
      <input type="number" id="quick-tip" placeholder="0" step="0.1">
    </div>
  </div>
  
  <button id="calculate-quick-btn" class="btn-full">Calculate Split</button>
  
  <div id="quick-result" class="result-box">
    <p style="color: var(--text-muted); justify-content: center;">Enter bill details above to see the breakdown.</p>
  </div>
</div>
